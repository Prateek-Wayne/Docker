version: '3.9'
services:
  react-app:
    build: .
    ports:
      - "3001:3000"
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./public
          action: sync
          target: /app/public
      environment:
      - CHOKIDAR_USEPOLLING=true